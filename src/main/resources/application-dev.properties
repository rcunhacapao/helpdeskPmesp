# Configurações usadas só em desenvolvimento local.
# Ative com --spring.profiles.active=dev (ou defina a variável de ambiente SPRING_PROFILES_ACTIVE=dev).

# Mostrar o SQL gerado pelo Hibernate ajuda a entender o que está acontecendo,
# mas não deve poluir os logs fora de desenvolvimento.
spring.jpa.show-sql=true

# A documentação interativa é ferramenta de desenvolvimento e não acompanha produção.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
