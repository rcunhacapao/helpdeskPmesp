# Em produção, o cookie só pode trafegar por HTTPS. O proxy reverso deve encaminhar
# corretamente o protocolo original para o Spring reconhecer a conexão segura.
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

# Evita alterações automáticas de estrutura no banco durante a execução em produção.
# O Flyway cria ou atualiza o esquema antes de o Hibernate validar o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
