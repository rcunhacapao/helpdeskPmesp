# Configurações do BD
spring.application.name = helpdesk37bpmm
spring.datasource.url=${DATABASE_URL}
spring.datasource.username = ${DATABASE_USERNAME}
spring.datasource.password = ${DATABASE_PASSWORD}

# Configurações do JPA // HIBERNATES
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger/OpenAPI fica desligado por padrão e é liberado somente no perfil dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Erros públicos nunca incluem detalhes internos, mensagens técnicas ou stack trace.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Configurações de sessão/login
# O cookie de sessão dura 2h mesmo que o navegador seja fechado; depois disso, expira
# e a pessoa precisa entrar de novo (não fica logada indefinidamente).
server.servlet.session.timeout=2h
server.servlet.session.cookie.max-age=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict







