# Configurações do BD
spring.application.name = helpdesk37bpmm
spring.datasource.driver=org.h2.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username = ${DATABASE_USERNAME}
spring.datasource.password = ${DATABASE_PASSWORD}

# Configurações do JPA // HIBERNATES
spring.jpa.hibernate.ddl-auto=update

# O console do H2 (/h2-console) só é ligado no profile "dev" (veja application-dev.properties).
# Por padrão ele fica desligado, porque a API ainda não tem login: deixá-lo sempre ligado
# permitiria qualquer pessoa que alcance o servidor rodar SQL livremente no banco.
spring.h2.console.enabled=false

# Configurações de sessão/login
# O cookie de sessão dura 2h mesmo que o navegador seja fechado; depois disso, expira
# e a pessoa precisa entrar de novo (não fica logada indefinidamente).
server.servlet.session.timeout=2h
server.servlet.session.cookie.max-age=2h







