services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk37bpmm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - helpdesk_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  helpdesk_pg_data:
